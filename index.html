<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pad Studio · Launchpad Mini MK3</title>
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#08090d;--surface:#11131a;--surface2:#171922;--surface3:#1c1f29;
 --ink:#f4f5f7;--mute:#9297a5;--line:#292d38;--line2:#373c49;
 --accent:#d7ff45;--accent2:#a9d81e;--blue:#58b7ff;--red:#ff526d;
 --pad:#242833;--pad2:#303541;--good:#58e3a5;--off:#2a2e39;
 color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)
}
:root[data-theme="light"]{
 --bg:#eceef2;--surface:#fff;--surface2:#f5f6f8;--surface3:#eef0f4;
 --ink:#17191f;--mute:#666b77;--line:#dfe2e8;--line2:#cdd1da;
 --accent:#79a900;--accent2:#5e8500;--blue:#147dcc;--red:#db3653;
 --pad:#d8dce4;--pad2:#cbd0da;--good:#159b68;--off:#e4e7ed;color-scheme:light
}
*,*::before,*::after{box-sizing:inherit}
body{
 margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
 font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.4
}
button,input,select{font:inherit}
.page{max-width:1280px;margin:auto;padding:18px 18px 40px}
header{
 display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;
 margin-bottom:12px;padding:13px 15px;border:1px solid var(--line);border-radius:12px;
 background:linear-gradient(180deg,var(--surface2),var(--surface));box-shadow:0 10px 35px rgba(0,0,0,.18)
}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.brandmark{
 width:36px;height:36px;border:1px solid var(--line2);border-radius:8px;display:grid;place-items:center;
 color:#111;background:var(--accent);font-weight:900;box-shadow:0 0 20px rgba(215,255,69,.15)
}
h1{font-size:1.25rem;font-weight:800;letter-spacing:-.025em;margin:0}
.subtitle{color:var(--mute);font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;margin-top:1px}
.conn{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:.78rem}
.statusText{max-width:300px}
.dot{width:8px;height:8px;border-radius:50%;background:#666b77;flex:none}
.dot.ok{background:var(--good);box-shadow:0 0 8px var(--good)}
.b{
 border:1px solid var(--line2);background:var(--surface2);color:var(--ink);padding:8px 11px;
 border-radius:7px;cursor:pointer;font-weight:650;font-size:.82rem;transition:.15s ease
}
.b:hover{border-color:var(--accent);background:var(--surface3)}
.b:focus-visible,.pad:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.b.on{background:var(--accent);border-color:var(--accent);color:#111;box-shadow:none}
.b:active{transform:scale(.97)}
.b:disabled{opacity:.4;cursor:not-allowed}
.b.hit{border-color:var(--accent)!important;box-shadow:0 0 10px var(--accent)}
.tabs{
 display:flex;align-items:center;gap:4px;margin-bottom:12px;padding:5px;
 background:var(--surface);border:1px solid var(--line);border-radius:9px
}
.tabs>.b{border-color:transparent;background:transparent;padding:7px 10px;font-size:.76rem}
.tabs>.b.on{background:var(--surface3);color:var(--ink);border-color:var(--line2)}
.tempo{
 display:flex!important;align-items:center;gap:8px;margin:0 2px 0 auto!important;
 padding:4px 8px 4px 11px!important;border-left:1px solid var(--line);color:var(--mute)!important
}
.tempo input{width:120px}
.tempo strong{font-variant-numeric:tabular-nums;color:var(--ink);min-width:28px}
.instrument{
 display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:12px;align-items:start
}
.deck{
 background:#0b0c10;border:1px solid #292d35;border-radius:14px;padding:12px;
 box-shadow:0 18px 55px rgba(0,0,0,.24)
}
.deckHead{
 display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 2px 10px;
 color:#858b98;font-size:.7rem;text-transform:uppercase;letter-spacing:.14em
}
.deckHead span:last-child{color:var(--accent);font-variant-numeric:tabular-nums}
.grid{
 display:grid;grid-template-columns:repeat(8,1fr);gap:6px;padding:7px;
 background:#15171d;border:1px solid #292c34;border-radius:9px;aspect-ratio:1;
 touch-action:none;user-select:none
}
.pad{
 min-width:0;border:1px solid rgba(255,255,255,.025);border-radius:5px;
 background:linear-gradient(145deg,var(--pad2),var(--pad));padding:0;cursor:pointer;
 transition:transform .07s,filter .1s,box-shadow .1s
}
.pad:active{transform:scale(.93)}
@media (hover:hover){.pad:hover{filter:brightness(1.2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}}
.side{
 display:flex;flex-direction:column;gap:12px;min-width:0
}
.card{
 background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:15px;
 box-shadow:0 10px 30px rgba(0,0,0,.10)
}
.card h2{font-size:.93rem;margin:0 0 6px;letter-spacing:.01em}
.card p{margin:0 0 10px;color:var(--mute);font-size:.8rem;max-width:60ch}
.card h2:not(:first-child){margin-top:17px;padding-top:13px;border-top:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.row label{display:inline-flex;align-items:center;gap:6px;color:var(--mute);font-size:.78rem}
input[type=range]{accent-color:var(--accent);width:130px}
select,input[type=number]{
 background:var(--surface2);border:1px solid var(--line2);color:var(--ink);
 padding:6px 8px;border-radius:6px;font-size:.78rem
}
input[type=color]{width:34px;height:28px;border:1px solid var(--line2);border-radius:6px;padding:0;background:none}
.sw{width:27px;height:27px;border-radius:50%;border:1px solid var(--line2);padding:0;cursor:pointer}
.sw.on{outline:2px solid var(--accent);outline-offset:2px}
.big{font-size:1.35rem;font-weight:800}
.lst{display:flex;gap:2px;margin-top:6px}.lst i{flex:1;height:7px;border-radius:2px;background:var(--line)}.lst i:nth-child(4n+1){height:11px}.lst i.on{background:var(--accent)}
.b.rec.on{background:var(--red);border-color:var(--red);color:#fff}
@media (max-width:900px){.instrument{grid-template-columns:1fr}.side{order:2}}
@media (max-width:650px){
 .page{padding:9px 8px 28px}
 header{grid-template-columns:1fr;padding:11px;border-radius:10px}
 .conn{justify-content:space-between}.statusText{max-width:none}
 .tabs{overflow:auto;flex-wrap:nowrap}.tabs>.b{white-space:nowrap}
 .tempo{min-width:205px}
 .deck{padding:8px;border-radius:11px}.grid{gap:4px;padding:5px}
 .pad{border-radius:4px}.card{padding:13px}
}
@media (prefers-reduced-motion:reduce){.pad,.b{transition:none}.pad:active,.b:active{transform:none}}
</style>
</head>
<body>
<div class="page">
<header>
  <div class="brand">
    <div class="brandmark">◉</div>
    <div><h1>Pad Studio</h1><div class="subtitle">Launchpad Mini MK3 · studio créatif</div></div>
  </div>
  <div class="conn">
    <span class="dot" id="dot"></span><span class="statusText" id="st" role="status">Launchpad non connecté · souris disponible</span>
    <button class="b" id="theme" title="Changer le thème">☼</button><button class="b" id="cn">MIDI</button>
  </div>
</header>
<div class="tabs" id="tabs">
  <button class="b" data-m="0">Sampler</button>
  <button class="b" data-m="1">Séquenceur</button>
  <button class="b" data-m="2">Game</button>
  <button class="b" data-m="3">Lights</button>
  <button class="b" data-m="4">Samples</button>
  <button class="b" data-m="5">Live</button>
  <label class="row tempo">BPM <input type="range" id="bp" min="70" max="160" value="110" aria-label="Tempo"> <strong id="bl">110</strong></label>
  <button class="b" id="met" aria-pressed="false" title="Métronome">♩ Métronome</button>
</div>
<div class="instrument">
  <section class="deck" aria-label="Surface de jeu">
    <div class="deckHead"><span>Performance grid · 8 × 8</span><span id="gridMode">SAMPLER</span></div>
    <div class="grid" id="g"></div>
  </section>
  <aside class="side">
    <div class="card" id="panel"></div>
  </aside>
</div>
</div>
<script>
const $=s=>document.querySelector(s);
let AC,out=null,mode=0,bpm=110,ck=null,nb;
const frame=Array.from({length:64},()=>[0,0,0]),fl={};
function hsl(h,s,l){const a=s*Math.min(l,1-l),f=n=>{const k=(n+h/30)%12;return Math.round(255*(l-a*Math.max(-1,Math.min(k-3,9-k,1))))};return[f(0),f(8),f(4)]}
/* ---------- audio ---------- */
let MB,DC,FX,FC;
function ac(){if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();const c=AC.createDynamicsCompressor(),g=AC.createGain();g.gain.value=.85;c.connect(g);g.connect(AC.destination);MB=c;const rv=AC.createConvolver(),n=AC.sampleRate*2.4|0,ib=AC.createBuffer(2,n,AC.sampleRate),rg=AC.createGain(),dl=AC.createDelay(1),fb=AC.createGain(),lf=AC.createBiquadFilter();
for(let h=0;h<2;h++){const d=ib.getChannelData(h);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.5)}
rv.buffer=ib;rg.gain.value=.5;dl.delayTime.value=.36;fb.gain.value=.38;lf.type='lowpass';lf.frequency.value=2200;
FX=AC.createGain();FX.connect(rv);rv.connect(rg);rg.connect(c);FX.connect(dl);dl.connect(lf);lf.connect(fb);fb.connect(dl);lf.connect(c)}if(AC.state!=='running')AC.resume();return AC}
const dec=raw=>(DC||(DC=new(window.OfflineAudioContext||window.webkitOfflineAudioContext)(1,1,44100))).decodeAudioData(raw);
function timer(fn,ms){let w,i;const fb=()=>{i=setInterval(fn,ms)};try{w=new Worker(URL.createObjectURL(new Blob([`setInterval(()=>postMessage(0),${ms})`])));w.onmessage=fn;w.onerror=()=>{w.terminate();w=null;fb()}}catch(e){fb()}return{stop:()=>{w&&w.terminate();clearInterval(i)}}}
function env(p,t,a,d,v){p.setValueAtTime(.0001,t);p.exponentialRampToValueAtTime(v,t+a);p.exponentialRampToValueAtTime(.0001,t+a+d)}
function tone(f,t,d,type,v,f2){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);env(g.gain,t,.004,d,v);o.connect(g);g.connect(MB);o.start(t);o.stop(t+d+.05);return g}
function noise(t,d,hp,v){const s=AC.createBufferSource();if(!nb){nb=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const a=nb.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}s.buffer=nb;const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=hp;const g=AC.createGain();env(g.gain,t,.002,d,v);s.connect(f);f.connect(g);g.connect(MB);s.start(t,Math.random()*.6);s.stop(t+d+.05);return g}
function drum(k,t=AC.currentTime,p=1){[
()=>tone(150*p,t,.4,'sine',.9,40),
()=>{noise(t,.18,1500,.5);tone(190*p,t,.12,'triangle',.4,120)},
()=>noise(t,.05,7000*p,.3),
()=>{[0,.012,.024].forEach(o=>noise(t+o,.05,1200,.35));noise(t+.03,.15,1200,.3)},
()=>tone(220*p,t,.3,'sine',.7,90),
()=>tone(800*p,t,.04,'square',.2),
()=>{tone(540*p,t,.2,'square',.15);tone(800*p,t,.2,'square',.15)},
()=>noise(t,.3,6000*p,.25)][k]()}
const SC=[0,2,4,7,9],nf=n=>130.8*Math.pow(2,(12*Math.floor(n/5)+SC[n%5])/12);
function lead(n,t=AC.currentTime,d=.5){tone(nf(n),t,d,'triangle',.35);tone(nf(n)*2.005,t,d*.6,'sine',.1)}
function later(t,fn){setTimeout(fn,Math.max(0,(t-AC.currentTime)*1000))}
function clockStart(onStep){clockStop();ac();let n=0,t=AC.currentTime+.05;ck=timer(()=>{if(t<AC.currentTime-.2)t=AC.currentTime+.05;while(t<AC.currentTime+.12){onStep(n++,t);t+=60/bpm/2}},25)}
function clockStop(){ck&&ck.stop();ck=null}
let met=null,mn=0,mt=0;
function metStart(t0,n0){met&&met.stop();ac();mt=t0||AC.currentTime+.06;mn=n0||0;
met=timer(()=>{if(mt<AC.currentTime-.2)mt=AC.currentTime+.05;
while(mt<AC.currentTime+.12){const acc=(((mn%4)+4)%4)===0,t=mt;tone(acc?1600:1000,t,.035,'square',acc?.09:.055);
later(t,()=>{const b=$('#met');if(b){b.classList.add('hit');setTimeout(()=>b.classList.remove('hit'),90)}});mt+=60/bpm;mn++}},25)}
function metStop(){met&&met.stop();met=null}
/* ---------- sons du sampler : batterie, basse fuzz, synthé psyché, claviers ---------- */
const PM=[0,3,5,7,10],PN=(n,b)=>b*Math.pow(2,(12*Math.floor(n/5)+PM[n%5])/12);
function wet(g,a){const w=AC.createGain();w.gain.value=a;g.connect(w);w.connect(FX)}
function fuzz(){if(!FC){FC=new Float32Array(512);for(let i=0;i<512;i++)FC[i]=Math.tanh((i/255.5-1)*5)}const w=AC.createWaveShaper();w.curve=FC;return w}
function kit(k,t=AC.currentTime){[
()=>{tone(140,t,.32,'sine',1,42);noise(t,.012,3000,.35)},
()=>{wet(noise(t,.2,1800,.55),.35);wet(tone(190,t,.14,'triangle',.45,130),.25)},
()=>noise(t,.045,8000,.28),
()=>noise(t,.4,6500,.25),
()=>{[0,.011,.022].forEach(o=>noise(t+o,.04,1300,.3));wet(noise(t+.03,.2,1300,.35),.55)},
()=>wet(tone(130,t,.5,'sine',.85,62),.3),
()=>wet(tone(200,t,.4,'sine',.8,105),.3),
()=>{tone(1700,t,.03,'square',.18);noise(t,.04,2500,.3)},
()=>{noise(t,.05,9000,.22);noise(t+.03,.18,9000,.2)},
()=>noise(t,.09,5000,.14),
()=>{tone(560,t,.28,'square',.14);tone(845,t,.28,'square',.14)},
()=>wet(noise(t,1.3,5000,.28),.5),
()=>tone(90,t,.9,'sine',.95,34),
()=>noise(t,.12,3000,.18),
()=>wet(tone(340,t,.22,'sine',.6,250),.3),
()=>wet(tone(1200,t,.18,'sawtooth',.14,180),.4)][k]()}
function bass(n,t=AC.currentTime,d=.5){const f=PN(n,41.2),o=AC.createOscillator(),o2=AC.createOscillator(),w=fuzz(),lp=AC.createBiquadFilter(),g=AC.createGain();
o.type='sawtooth';o2.type='square';o.frequency.value=f;o2.frequency.value=f/2;o.detune.value=-6;lp.type='lowpass';lp.frequency.setValueAtTime(1400,t);lp.frequency.exponentialRampToValueAtTime(350,t+d);
env(g.gain,t,.01,d,.35);o.connect(w);o2.connect(w);w.connect(lp);lp.connect(g);g.connect(MB);[o,o2].forEach(x=>{x.start(t);x.stop(t+d+.1)})}
function psy(n,t=AC.currentTime,d=1){const f=PN(n,130.8),g=AC.createGain(),lp=AC.createBiquadFilter(),l=AC.createOscillator(),lg=AC.createGain();
lp.type='lowpass';lp.frequency.setValueAtTime(3200,t);lp.frequency.exponentialRampToValueAtTime(900,t+d);l.frequency.value=.7;lg.gain.value=700;l.connect(lg);let nd=lp;
for(let k=0;k<3;k++){const a=AC.createBiquadFilter();a.type='allpass';a.frequency.value=1000+k*400;lg.connect(a.frequency);nd.connect(a);nd=a}
[-9,0,9].forEach(dt=>{const o=AC.createOscillator();o.type='sawtooth';o.frequency.value=f;o.detune.value=dt;o.connect(lp);o.start(t);o.stop(t+d+.3)});
l.start(t);l.stop(t+d+.3);env(g.gain,t,.03,d,.12);lp.connect(g);nd.connect(g);g.connect(MB);wet(g,.45)}
function keys(n,t=AC.currentTime,d=1.3){const f=PN(n,261.6);wet(tone(f,t,d,'sine',.28),.5);tone(f*1.004,t,d,'sine',.14);tone(f*2,t,d*.5,'sine',.09);tone(f*4.01,t,.15,'sine',.05)}
/* ---------- sampler ---------- */
const SA={
panel:()=>`<h2>Performance</h2><p>Les pads jouent directement les couches de l'instrument. Les deux premières rangées sont percussives, puis viennent basse, synthé et claviers.</p><div class="row"><span style="font-size:.72rem;color:var(--mute);letter-spacing:.08em;text-transform:uppercase">Live instrument</span><span style="font-size:.72rem;color:var(--accent)">● Ready</span></div>${lpBar()}`,
draw(){for(let r=0;r<8;r++)for(let c=0;c<8;c++){const i=r*8+c;frame[i]=fl[i]?[255,255,255]:r<2?hsl(c*45,1,.3):r<4?hsl(15+c*6,.95,.32):r<6?hsl(265+c*10,.9,.35):hsl(175+c*8,.85,.32)}},
press(r,c,d){if(!d)return;ac();const i=r*8+c;hit(i);lpRec(0,i);fl[i]=1;render();setTimeout(()=>{delete fl[i];render()},130)}};
/* ---------- séquenceur ---------- */
const st=Array.from({length:8},()=>Array(8).fill(0));let ph=-1;
function inst(r,t){r<5?drum(r,t):r==5?tone(55,t,.3,'square',.22,50):lead(r==6?5:9,t,.25)}
const SEQ={
panel:()=>`<h2>Séquenceur</h2><p>8 pas, 8 sons de bas en haut : kick, caisse claire, charley, clap, tom, basse, deux notes. Appuie sur un pad pour l'activer.</p><div class="row"><button class="b ${ck?'on':''}" data-act="play">${ck?'Arrêter':'Lecture'}</button><button class="b" data-act="clear">Tout effacer</button></div>`,
draw(){for(let r=0;r<8;r++)for(let c=0;c<8;c++){const on=st[r][c],h=r*45,hot=c===ph;frame[r*8+c]=on?(hot?[255,255,255]:hsl(h,1,.5)):hot?[70,70,80]:hsl(h,.6,.1)}},
press(r,c,d){if(d){st[r][c]^=1;render()}},
step(s,t){const c=s%8;for(let r=0;r<8;r++)if(st[r][c])inst(r,t);later(t,()=>{if(ck){ph=c;render()}})},
leave(){ph=-1}};
/* ---------- jeu (Simon) ---------- */
let sq=[],gi=0,gp='idle',lit=-1,tok=0,best=0;
const QC=[120,0,50,220],QF=[262,330,392,523],qOf=(r,c)=>(r>3?0:2)+(c>3?1:0),sleep=ms=>new Promise(r=>setTimeout(r,ms));
function info(){const e=$('#gi');if(!e)return;e.textContent={idle:'Appuie sur un pad pour commencer.',show:'Regarde la séquence…',input:`À toi ! ${gi}/${sq.length}`,over:`Raté ! Score : ${sq.length-1}. Appuie sur un pad pour rejouer.`}[gp]}
async function flashQ(q,ms){lit=q;tone(QF[q],AC.currentTime,ms/1000,'triangle',.4);render();await sleep(ms);lit=-1;render()}
async function next(){const k=++tok;gp='show';sq.push(Math.random()*4|0);info();await sleep(500);for(const q of sq){if(k!==tok)return;await flashQ(q,Math.max(220,500-sq.length*20));await sleep(130)}if(k===tok){gp='input';gi=0;info()}}
const GAME={
panel:()=>`<h2>Simon</h2><p>Les quatre coins du Launchpad s'allument. Répète la séquence, elle s'allonge à chaque tour.</p><div class="big" id="gi"></div><p id="gb"></p>`,
draw(){for(let r=0;r<8;r++)for(let c=0;c<8;c++){const q=qOf(r,c);frame[r*8+c]=gp==='over'?hsl(0,1,.15):hsl(QC[q],1,lit===q?.6:.2)}const b=$('#gb');if(b)b.textContent=best?`Meilleur score : ${best}`:'';info()},
press(r,c,d){if(!d)return;ac();if(gp==='idle'||gp==='over'){sq=[];next();return}if(gp!=='input')return;const q=qOf(r,c);flashQ(q,200);if(q===sq[gi]){if(++gi===sq.length){gp='show';const k=tok;setTimeout(()=>{if(k===tok)next()},600)}else info()}else{best=Math.max(best,sq.length-1);gp='over';tone(100,AC.currentTime,.6,'sawtooth',.4,50);render()}},
leave(){tok++;gp='idle';sq=[];lit=-1}};
/* ---------- lumières ---------- */
const PAL=[null,[255,40,90],[255,150,20],[250,230,40],[40,230,110],[30,200,255],[110,90,255],[255,255,255]];
let fr=[new Array(64).fill(0)],cf=0,cc=1,anim=-1,muse=true,dv=1;
const LI={
panel:()=>`<h2>Éditeur de lumières</h2><p>Choisis une couleur, dessine sur les pads (glisse pour peindre), ajoute des images et lance l'animation avec la musique.</p>
<div class="row">${PAL.map((c,i)=>`<button class="sw ${cc===i?'on':''}" data-act="col" data-v="${i}" aria-label="${i?'Couleur '+i:'Gomme'}" aria-pressed="${cc===i}" style="background:${c?`rgb(${c})`:'var(--off)'}"></button>`).join('')}</div>
<div class="row">${fr.map((_,i)=>`<button class="b ${cf===i?'on':''}" data-act="fr" data-v="${i}">${i+1}</button>`).join('')}</div>
<div class="row"><button class="b" data-act="add">Nouvelle image</button><button class="b" data-act="dup">Dupliquer</button><button class="b" data-act="del">Supprimer</button><button class="b" data-act="wipe">Vider</button></div>

<div class="lst">${'<i></i>'.repeat(16)}</div></div>`}
/* ---------- live perf : clique en rythme, les lumières te guident ---------- */
const WD=[[45,85,130],[30,60,100],[22,45,75]],LV={on:false,gid:null,notes:[],lo:0,fx:[],score:0,combo:0,max:0,cnt:{p:0,g:0,o:0,m:0},msg:'',msgT:0,sum:'',lead:1.2,t0:0,dur:0,src:null};
const lcol=i=>hsl(i*37%360,1,.5),lvT=()=>AC.currentTime-(AC.outputLatency||0)-(AC.baseLatency||0)-LV.t0-CF.off/1000;
function songs(){const m=new Map();BK.forEach(b=>b.forEach(s=>{if(s&&s.buf&&s.buf.duration>=10&&!m.has(s.gid))m.set(s.gid,{gid:s.gid,name:s.bn||s.name,buf:s.buf})}));return[...m.values()]}
function pickPad(prev,m){const c=[];for(let q=0;q<64;q++)if(prev<0||Math.max(Math.abs((q>>3)-(prev>>3)),Math.abs((q&7)-(prev&7)))>=m)c.push(q);return c[Math.random()*c.length|0]}
function chart(buf){const an=analyze(buf);if(!an.bpm)return null;const T=60/an.bpm,e=an.env,mean=an.mean,dur=buf.duration,N=[3,2,1][CF.ld],out=[];
const at=t=>{const n=Math.round(t/.01);let a=0;for(let x=n-3;x<=n+3;x++)a+=e[x]||0;return a/7};
const bs=[0,0,0,0];for(let k=0;;k++){const t=an.ph+k*T;if(t>dur-.6)break;bs[k&3]+=at(t)}

function lvJudge(r,n,err){const q=LV;q.cnt[r]++;
if(r==='m'){q.combo=0;q.msg='Raté';q.fx.push({i:n.i,t:performance.now(),c:[255,50,50],k:'m'})}
else{q.combo++;q.max=Math.max(q.max,q.combo);q.score+={p:300,g:200,o:100}[r]*Math.min(4,1+Math.floor(q.combo/10));
q.msg={p:'Parfait',g:'Bien',o:'Ok'}[r]+' · '+(err>0?'tard ':'tôt ')+Math.abs(Math.round(err))+' ms';
q.fx.push({i:n.i,t:performance.now(),c:{p:[255,255,255],g:[80,255,140],o:[255,210,60]}[r],k:'h'})}

function lvStart(){const sg=songs().find(x=>x.gid===LV.gid);if(!sg)return;ac();const ch=chart(sg.buf);
if(!ch||ch.length<2){LV.sum=ch?'Musique trop courte pour cette difficulté.':'Impossible de trouver le rythme de cette musique.';setPanel();return}
lvStop(true);const an=analyze(sg.buf),T=60/an.bpm;
Object.assign(LV,{notes:ch,lo:0,fx:[],score:0,combo:0,max:0,cnt:{p:0,g:0,o:0,m:0},msg:'',sum:'',lead:Math.min(1.8,Math.max(.9,2*T)),dur:sg.buf.duration,t0:AC.currentTime+2.2});

const so=AC.createBufferSource(),g=AC.createGain();so.buffer=sg.buf;so.connect(g);g.connect(MB);so.start(LV.t0);LV.src=so;LV.on=true;
if(met){const kk=Math.ceil((AC.currentTime-LV.t0-an.ph)/T);metStart(LV.t0+an.ph+kk*T,kk)}

function lvStop(quiet){try{LV.src&&LV.src.stop()}catch(e){}LV.src=null;const was=LV.on;LV.on=false;if(!quiet&&was){LV.sum='Arrêté.';setPanel()}}
function lvEnd(){try{LV.src&&LV.src.stop()}catch(e){}LV.src=null;LV.on=false;const c=LV.cnt,n=LV.notes.length||1,acc=Math.round((c.p+.7*c.g+.4*c.o)/n*100),rk=acc>=95?'S':acc>=85?'A':acc>=70?'B':acc>=50?'C':'D';
LV.sum=`Terminé · Score ${LV.score} · Précision ${acc}% · Rang ${rk} · Combo max ${LV.max}`;setPanel()}
const LIVE={
panel:()=>{const L=songs();if(L.length&&!L.some(x=>x.gid===LV.gid))LV.gid=L[0].gid;
return`<h2>Live perf</h2><p>Appuie sur les pads en rythme avec la musique. Un anneau se resserre sur chaque pad à jouer et celui-ci s'allume pleinement sur le premier temps d'une mesure.</p>
${L.length?`<div class="row"><label>Musique <select id="lsong">${L.map(x=>opt(x.gid,esc(x.name),LV.gid)).join('')}</select></label></div>`:`<p>Importe d'abord une musique (10 s ou plus) dans l'onglet Samples.</p>`}
<div class="row"><label>Difficulté <select data-cfg="ld">${['Facile · un pad toutes les 3 mesures','Normal · un pad toutes les 2 mesures','Difficile · un pad à chaque mesure, fenêtre très serrée'].map((t,i)=>opt(i,t,CF.ld)).join('')}</select></label></div>
<div class="row"><label>Décalage audio <input type="range" data-cfg="off" min="-150" max="150" step="5" value="${CF.off}"><output>${CF.off} ms</output></label></div>
<div class="row"><button class="b ${LV.on?'on':''}" data-act="${LV.on?'lvstop':'lvstart'}" ${L.length?'':'disabled'}>${LV.on?'■ Arrêter':'▶ Lancer'}</button></div>
<div class="big" id="lvst"></div><p id="lvj" style="min-height:1.3em;margin:6px 0 0;color:var(--ink);font-weight:650"></p>`},
draw(){const now=performance.now();for(let i=0;i<64;i++)frame[i]=[4,4,8];
if(LV.on){const T=lvT(),W=WD[CF.ld];if(T>LV.dur+1.2){lvEnd();return}
while(LV.lo<LV.notes.length&&(LV.notes[LV.lo].j||T-LV.notes[LV.lo].t>W[2]/1000)){const n=LV.notes[LV.lo];if(!n.j){n.j='m';lvJudge('m',n,0)}LV.lo++}
if(T<0){const f=((-T)%.55)/.55;for(const q of[27,28,35,36])ad(q,[255,255,255],(1-f)*.35)}
let fu=true;for(let k=LV.lo;k<LV.notes.length;k++){const n=LV.notes[k],dt=n.t-T;if(dt>LV.lead)break;if(n.j)continue;
const p=Math.max(0,1-dt/LV.lead),c=lcol(n.i),w=fu?1:.7;fu=false;

for(const f of LV.fx){const u=(now-f.t)/350;if(f.k==='h')ring(f.i,u*2.8,(1-u)*.9,f.c,.55);else ad(f.i,f.c,(1-u)*.5)}

const a=$('#lvst'),b=$('#lvj'),any=LV.cnt.p+LV.cnt.g+LV.cnt.o+LV.cnt.m>0;
if(a)a.textContent=LV.on||any?`Score ${LV.score} · Combo ${LV.combo}`:'';
if(b)b.textContent=LV.on?(lvT()<0?'Prépare-toi…':now-LV.msgT<1200?LV.msg:''):LV.sum},
press(r,c,d){if(!d||!LV.on)return;ac();const i=r*8+c,T=lvT(),W=WD[CF.ld];let best=null,bd=9;
for(let k=LV.lo;k<LV.notes.length;k++){const n=LV.notes[k];if(n.t-T>W[2]/1000)break;if(n.j||n.i!==i)continue;const e=Math.abs(n.t-T);if(e<bd){bd=e;best=n}}
if(!best)return;const err=(T-best.t)*1000,a=Math.abs(err),res=a<=W[0]?'p':a<=W[1]?'g':'o';best.j=res;lvJudge(res,best,err);

leave(){lvStop(true)}};
const M=[SA,SEQ,GAME,LI,MY,LIVE];
/* ---------- rendu + matériel ---------- */
const cells=[];let q=0;
function render(){if(q)return;const f=()=>{q=0;M[mode].draw();paint()};q=document.hidden?setTimeout(f,40):requestAnimationFrame(f)}
const pk=[];
function paint(){frame.forEach((f,i)=>{const k=f[0]+","+f[1]+","+f[2];if(pk[i]===k)return;pk[i]=k;const b=cells[i],on=f[0]+f[1]+f[2]>0;b.style.background=on?`rgb(${f})`:'';b.style.boxShadow=on?`0 0 12px rgba(${f},.6)`:''});send()}
const sent=[];
let lastSend=0,sq2=0;
function send(){if(!out)return;const nw=performance.now();if(nw-lastSend<33){if(!sq2)sq2=setTimeout(()=>{sq2=0;send()},34);return}lastSend=nw;const m=[0xF0,0,0x20,0x29,2,0x0D,3],n0=m.length;
for(let i=0;i<64;i++){const f=frame[i],c=[f[0]>>1,f[1]>>1,f[2]>>1],k=c.join();if(sent[i]===k)continue;sent[i]=k;m.push(3,(i>>3)*10+11+(i&7),...c)}
for(let k=0;k<6;k++){const on=k===mode,key=on?'on':'off';if(sent[64+k]===key)continue;sent[64+k]=key;m.push(3,91+k,...(on?[127,127,127]:[8,8,16]))}
if(m.length===n0)return;m.push(0xF7);outs.forEach(p=>{try{p.send(m)}catch(e){}})}
function setMode(m){M[mode].leave&&M[mode].leave();clockStop();if(m!==0)lpStop();mode=m;const gm=$('#gridMode');if(gm)gm.textContent=['SAMPLER','SEQUENCER','GAME','LIGHTS','SAMPLES','LIVE PERF'][m];document.querySelectorAll('#tabs [data-m]').forEach(b=>{const on=+b.dataset.m===m;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)});setPanel();render()}
function setPanel(){$('#panel').innerHTML=M[mode].panel()}
/* ---------- interface ---------- */
const g=$('#g');let held=null;
for(let r=7;r>=0;r--)for(let c=0;c<8;c++){const b=document.createElement('button');b.className='pad';b.setAttribute('aria-label',`Pad ${r+1}-${c+1}`);cells[r*8+c]=b;
b.onpointerdown=e=>{e.preventDefault();try{b.releasePointerCapture(e.pointerId)}catch(_){}ac();held=[r,c];M[mode].press(r,c,true)};
b.onpointerenter=e=>{if(e.buttons&1&&M[mode].drag)M[mode].drag(r,c)};
b.onkeydown=e=>{if((e.key===' '||e.key==='Enter')&&!e.repeat){e.preventDefault();ac();M[mode].press(r,c,true)}};
b.onkeyup=e=>{if(e.key===' '||e.key==='Enter')M[mode].press(r,c,false)};g.appendChild(b)}
['pointerup','pointercancel'].forEach(ev=>addEventListener(ev,()=>{if(held){M[mode].press(held[0],held[1],false);held=null}}));

function act(a,v){
if(a==='imp'){$('#fi').click();return}
if(['bank','rm','rmall','resplit'].includes(a))gclear();
if(a==='lrec')loRec();
else if(a==='lplay')loPlay();
else if(a==='lover')loOver();
else if(a==='lclr')loClear();
else if(a==='rmall'){if(confirm('Retirer tous les sons des pads ?'))smp.forEach((s,i)=>{if(s)release(i)})}
else if(a==='rm')release(sel);
else if(a==='resplit')resplit();
else if(a==='grp'){const s=smp[sel];if(s){const c=base(sel);smp.forEach((p,i)=>{if(p&&p.gid===s.gid){p.col=[...c];dbPut(K(i),meta(i))}})}}
else if(a==='padreset'){const s=smp[sel];if(s){delete s.col;dbPut(K(sel),meta(sel))}}
if(a==='play'){ck?(clockStop(),anim=-1,ph=-1):clockStart(M[mode].step)}
else if(a==='clear')st.forEach(r=>r.fill(0));
else if(a==='col')cc=+v;else if(a==='fr')cf=+v;
else if(a==='add'){fr.push(new Array(64).fill(0));cf=fr.length-1}
else if(a==='dup'){fr.splice(cf+1,0,[...fr[cf]]);cf++}

$('#panel').onclick=e=>{const b=e.target.closest('[data-act]');if(b)act(b.dataset.act,b.dataset.v)};
/* ---------- Web MIDI ---------- */
function onMidi(e){const[s,d1,d2]=e.data,t=s&0xF0,k=e.data.join(),n=performance.now();if(k===lastK&&n-lastT<15)return;lastK=k;lastT=n;

function lpAttach(){const os=lpAll(midi.outputs),is=lpAll(midi.inputs),o=lpPick(midi.outputs)||os[0];if(!o||!is.length)return false;
outs=os;out=o;is.forEach(i=>{i.onmidimessage=onMidi});sent.length=0;pk.length=0;outs.forEach(p=>{try{p.send([0xF0,0,0x20,0x29,2,0x0D,0x0E,1,0xF7])}catch(e){}});

$('#cn').onclick=async()=>{
try{ac();if(!midi){midi=await navigator.requestMIDIAccess({sysex:true});
midi.onstatechange=()=>{const here=out&&outs.some(o=>[...midi.outputs.values()].some(p=>p.id===o.id&&p.state==='connected'));
if(out&&!here){out=null;setSt('Launchpad débranché : rebranche-le, il se reconnectera tout seul.',0)}else if(!out)lpAttach()}}
if(!lpAttach())setSt('Launchpad introuvable : branche-le en USB puis réessaie.',0)}
catch(err){setSt("Web MIDI indisponible ou refusé : utilise Chrome ou Edge et autorise l'accès.",0)}};
addEventListener('pagehide',()=>{if(out)outs.forEach(p=>{try{p.send([0xF0,0,0x20,0x29,2,0x0D,0x0E,0,0xF7])}catch(e){}})});
$('#panel').oninput=e=>{const t=e.target;if(t.dataset.cfg&&/range|color/.test(t.type))cfgSet(t)};
$('#panel').onchange=e=>{const t=e.target;
if(t.id==='fi'){importFiles([...t.files],sel);t.value=''}

else if(t.dataset.cfg){cfgSet(t);if(t.type!=='range')setPanel()}};
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault();const fs=[...e.dataTransfer.files];if(!fs.length)return;if(mode!==4)setMode(4);importFiles(fs,sel)});
{const R=document.documentElement,ap=l=>l?R.dataset.theme='light':R.removeAttribute('data-theme');try{ap(localStorage.getItem('padtheme')==='light')}catch(e){}
$('#theme').onclick=()=>{const l=R.dataset.theme!=='light';ap(l);try{localStorage.setItem('padtheme',l?'light':'dark')}catch(e){}}}
setMode(4);dbLoad();try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
</script>
